name: Build Zhubei Walk Capture IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ZhubeiWalkCapture-v0.3.2-source.zip"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout source package
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unpack App source
        run: |
          mkdir source
          unzip -q ZhubeiWalkCapture-v0.3.2-source.zip -d source
          test -f source/ios-capture/StrayScanner.xcodeproj/project.pbxproj

      - name: Build unsigned iPhone App
        run: |
          xcodebuild -workspace source/ios-capture/StrayScanner.xcworkspace -scheme StrayScanner -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" clean build

      - name: Run simulator XCTest
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | sed -n 's/.*iPhone 16 (\([0-9A-F-]*\)).*/\1/p' | head -n 1)"
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -workspace source/ios-capture/StrayScanner.xcworkspace -scheme StrayScanner -configuration Debug -sdk iphonesimulator -destination "id=$SIMULATOR_ID" -destination-timeout 60 -derivedDataPath "$RUNNER_TEMP/TestDerivedData" -resultBundlePath "$RUNNER_TEMP/StrayScannerCore.xcresult" -only-testing:StrayScannerTests/StrayScannerTests/testCaptureMissionStateRequiresEndpointConfirmationBeforeReturn -only-testing:StrayScannerTests/StrayScannerTests/testCaptureMissionStateRejectsSkippingAnchor -only-testing:StrayScannerTests/StrayScannerTests/testImageQualityWarningsDoNotBlockCompletion -only-testing:StrayScannerTests/StrayScannerTests/testMissingAnchorsLegsOrReferencesAreHardBlocks -only-testing:StrayScannerTests/StrayScannerTests/testStartAnchorRequiresEvidenceNearEndpoint -only-testing:StrayScannerTests/StrayScannerTests/testP0UsesOneFixedFourMetrePolicy -only-testing:StrayScannerTests/StrayScannerTests/testViewAdapterMapsGroundAndFloorBothWays -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 30 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/StrayScanner.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ZhubeiWalkCapture-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhubeiWalkCapture-unsigned
          path: ${{ runner.temp }}/ZhubeiWalkCapture-unsigned.ipa
          retention-days: 7
