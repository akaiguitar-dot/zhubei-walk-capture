name: Build Zhubei Walk Capture IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ZhubeiWalkCapture-v0.1.1-source-portable.zip"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source package
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unpack App source
        run: |
          mkdir source
          unzip -q ZhubeiWalkCapture-v0.1.1-source-portable.zip -d source
          test -f source/ios-capture/StrayScanner.xcodeproj/project.pbxproj

      - name: Build unsigned iPhone App
        run: |
          xcodebuild             -workspace source/ios-capture/StrayScanner.xcworkspace             -scheme StrayScanner             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$RUNNER_TEMP/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             clean build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/StrayScanner.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload ZhubeiWalkCapture-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhubeiWalkCapture-unsigned
          path: ${{ runner.temp }}/ZhubeiWalkCapture-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
